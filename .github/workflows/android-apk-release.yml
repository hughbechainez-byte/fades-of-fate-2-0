name: Android APK + Content Feed

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Android content feed package
        run: |
          python tools/build_content_release.py --output-dir dist/content --content-revision "${{ github.run_number }}"

      - name: Upload content feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: fades-content-feed
          path: |
            dist/content/fades-of-fate-content-manifest.json
            dist/content/fades-of-fate-content-pack.zip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-17-jdk python3-pip git zip unzip
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build Android debug APK
        run: |
          cd android
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fades-apk-debug
          path: |
            android/bin/*.apk
            dist/content/fades-of-fate-content-manifest.json
            dist/content/fades-of-fate-content-pack.zip

      - name: Publish release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            android/bin/*.apk
            dist/content/fades-of-fate-content-manifest.json
            dist/content/fades-of-fate-content-pack.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
