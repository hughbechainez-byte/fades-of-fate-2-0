name: Android APK + Content Feed

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Android content feed package
        run: |
          python tools/build_content_release.py --output-dir dist/content --strict

      - name: Embed the matching content baseline in the APK
        run: |
          cp dist/content/fades-of-fate-content-manifest.json data/content-manifest.json

      - name: Upload content feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: fades-content-feed
          path: |
            dist/content/fades-of-fate-content-manifest.json
            dist/content/fades-of-fate-content-manifest-pc.json
            dist/content/fades-of-fate-content-manifest-android.json
            dist/content/fades-of-fate-content-pack.zip
            dist/content/build_provenance.json
            dist/content/build_provenance-pc.json
            dist/content/build_provenance-android.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk python3-pip git zip unzip \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install buildozer cython==0.29.36

      - name: Run canonical visual acceptance gate
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: |
          python -m unittest discover -s tests -q
          python tools/Render-Route-Scenery-QA.py --visual-review-approved
          python tools/validate_chapter1.py --output build/chapter1_validation_android.json
          python -m src.main --self-test
          python tools/validate_visual_acceptance.py \
            --validation-report build/chapter1_validation_android.json \
            --content-dir dist/content \
            --runtime-provenance build/runtime_provenance.json \
            --output build/visual_acceptance_android.json

      - name: Build Android debug APK
        run: |
          cp dist/content/build_provenance-android.json build_provenance.json
          cd android
          buildozer -v android debug

      - name: Reject unresolved Pygame ARM64 SIMD symbols
        run: |
          SURFACE_SO="$(find android/.buildozer/android -path '*/arm64-v8a/pygame/surface.so' -print -quit)"
          LLVM_READELF="$(find "$ANDROID_HOME/ndk" -path '*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf' -print -quit)"
          test -n "$SURFACE_SO"
          test -n "$LLVM_READELF"
          if "$LLVM_READELF" --dyn-syms --wide "$SURFACE_SO" | grep -E 'UND.*(alphablit_alpha_sse2|blit_blend_.*_(sse2|avx2)|premul_surf_color_by_alpha_sse2|pg_has_avx2)'; then
            echo "Pygame surface.so contains unresolved SIMD symbols"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fades-apk-debug
          path: |
            android/bin/*.apk
            dist/content/fades-of-fate-content-manifest.json
            dist/content/fades-of-fate-content-manifest-pc.json
            dist/content/fades-of-fate-content-manifest-android.json
            dist/content/fades-of-fate-content-pack.zip
            dist/content/build_provenance.json
            dist/content/build_provenance-pc.json
            dist/content/build_provenance-android.json
            build/chapter1_location_sources_report.json
            build/chapter1_validation_android.json
            build/visual_acceptance_android.json

      - name: Publish release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            android/bin/*.apk
            dist/content/fades-of-fate-content-manifest.json
            dist/content/fades-of-fate-content-manifest-pc.json
            dist/content/fades-of-fate-content-manifest-android.json
            dist/content/fades-of-fate-content-pack.zip
            dist/content/build_provenance.json
            dist/content/build_provenance-pc.json
            dist/content/build_provenance-android.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
