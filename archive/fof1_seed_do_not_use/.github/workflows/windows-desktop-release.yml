name: Windows Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to build and attach the Windows package to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      WINDOWS_ARCHIVE: dist/The-Fades-of-Fate-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}-Windows-x64.zip

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create build environment
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Build and validate Windows package
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Build-Windows.ps1 -SkipDesktopInstall -VisualReviewApproved

      - name: Archive Windows package
        run: |
          $packageDir = Join-Path $PWD 'dist\The Fades of Fate'
          $archive = Join-Path $PWD $env:WINDOWS_ARCHIVE
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'The Fades of Fate.exe'))) {
            throw "Packaged executable is missing: $packageDir"
          }
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $archive -CompressionLevel Optimal -Force

      - name: Build application update manifest
        run: |
          python tools/build_app_update_manifest.py `
            --release-tag "$env:RELEASE_TAG" `
            --package "$env:WINDOWS_ARCHIVE" `
            --package-url "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$(Split-Path -Leaf $env:WINDOWS_ARCHIVE)"

      - name: Upload workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fades-of-fate-windows-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.WINDOWS_ARCHIVE }}
            dist/fades-of-fate-app-manifest.json
            dist/content/fades-of-fate-content-manifest.json
            dist/content/fades-of-fate-content-manifest-pc.json
            dist/content/fades-of-fate-content-manifest-android.json
            dist/content/fades-of-fate-content-pack.zip
            dist/content/build_provenance.json
            dist/content/build_provenance-pc.json
            dist/content/build_provenance-android.json
            dist/The Fades of Fate/build_provenance.json
            dist/The Fades of Fate/build/runtime_provenance.json
            dist/The Fades of Fate/build/self_test_report.json
            build/chapter1_validation_build.json
            build/visual_acceptance.json
          if-no-files-found: error

      - name: Publish Windows package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.WINDOWS_ARCHIVE }}
            dist/fades-of-fate-app-manifest.json
            dist/content/fades-of-fate-content-manifest.json
            dist/content/fades-of-fate-content-manifest-pc.json
            dist/content/fades-of-fate-content-manifest-android.json
            dist/content/fades-of-fate-content-pack.zip
            dist/content/build_provenance.json
            dist/content/build_provenance-pc.json
            dist/content/build_provenance-android.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
